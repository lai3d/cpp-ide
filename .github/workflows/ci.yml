name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # version number from git describe

      - name: Install CMake and Ninja
        run: brew install cmake ninja || true

      - name: Allow debugging (lldb)
        run: sudo DevToolsSecurity -enable || true

      - name: Toolchain
        run: |
          swift --version
          xcrun clang --version
          xcrun -f clangd
          xcrun -f lldb-dap || true
          cmake --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Bundle CppIDE.app
        run: ./scripts/bundle.sh

      - uses: actions/upload-artifact@v7
        with:
          name: CppIDE-app
          path: build/CppIDE.zip
