name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bundle CppIDE.app
        run: ./scripts/bundle.sh

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/CppIDE.zip \
            --title "CppIDE $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Ad-hoc signed build: the first time, right-click CppIDE.app and choose Open (or run: xattr -dr com.apple.quarantine CppIDE.app). Requires macOS 14+ and Xcode or the Command Line Tools (clang, clangd, lldb-dap); CMake for CMake projects."
